spring.application.name=task-manager

# Кодировка
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# DataSource (можно переопределить через env: SPRING_DATASOURCE_URL и т.д.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:011101}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

spring.mustache.suffix=.mustache
spring.mustache.check-template-location=true

# Auth (переопределяется через env APP_USERNAME / APP_PASSWORD)
app.username=${APP_USERNAME:liries123}
app.password=${APP_PASSWORD:123pp}